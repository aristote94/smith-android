name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Les fichiers du pack d'icônes sont générés. Si quelqu'un édite appfilter.xml,
      # drawable.xml, les vecteurs ou IconPackCatalog.kt à la main, la régénération
      # produit un diff et le job échoue ici plutôt qu'en production.
      - name: Vérifier les fichiers générés
        run: |
          python3 tools/gen_icons.py
          python3 tools/gen_iconpack.py --check
          git diff --exit-code

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Tests unitaires
        run: ./gradlew :app:testDebugUnitTest

      # Compile les tests instrumentés sans les exécuter : détecte les ruptures d'API
      # sans payer un émulateur à chaque push.
      - name: Compiler les tests instrumentés
        run: ./gradlew :app:assembleDebugAndroidTest

      - name: APK de debug
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: smith-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Rapports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            app/build/reports/
            app/build/intermediates/lint_intermediate_text_report/
          retention-days: 7
